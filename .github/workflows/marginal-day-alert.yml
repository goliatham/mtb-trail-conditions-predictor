name: Alum Creek — Marginal Day Alert

on:
  workflow_run:
    workflows: ["Daily Predictions"]
    types: [completed]

jobs:
  check:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check if today is marginal (40–74%)
        run: |
          python3 << 'EOF'
          import json, sys
          from datetime import date

          today = date.today().isoformat()
          preds = json.load(open("docs/predictions.json"))

          marginal = []
          for trail_key, trail in preds["trails"].items():
              for day in trail["days"]:
                  if day["date"] == today:
                      pct = round(day["score"] * 100)
                      print(f"{trail['trail_name']}: {pct}%")
                      if 40 <= pct <= 74:
                          marginal.append(f"{trail['trail_name']} {pct}%")

          if not marginal:
              print("Not marginal — no alert.")
              sys.exit(0)

          print(f"MARGINAL: {', '.join(marginal)}")
          sys.exit(1)
          EOF
